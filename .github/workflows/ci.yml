name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (unit + fuzz, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: make test SCALE=3

  compile-examples:
    name: Compile examples (ESP32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - examples
          libraries: |
            - source-path: ./
